<!DOCTYPE html>
<html lang="uz">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Shajara</title>
<style>
:root{--bg:#f6f1e3;--ink:#2f3b25;--mute:#6b7560;--card:#e3ebd8;--warm:#f0e1c8;--line:#6b7d57;--me:#f3d9a4;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#1d2318;--ink:#e8edd9;--mute:#a3ad94;--card:#2d3a26;--warm:#4a4130;--line:#8fa07a;--me:#6a5a2c}}
:root[data-theme="dark"]{--bg:#1d2318;--ink:#e8edd9;--mute:#a3ad94;--card:#2d3a26;--warm:#4a4130;--line:#8fa07a;--me:#6a5a2c}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:Georgia,"Times New Roman",serif;padding:16px 8px}
h1{text-align:center;margin:6px 0 2px;font-size:2rem}
h2{text-align:center;margin:28px 0 4px;font-size:1.3rem}
.hint{text-align:center;color:var(--mute);font-size:.8rem;margin:0 0 8px}
.scroll{overflow-x:auto;padding-bottom:12px}
.tree{display:table;margin:0 auto;min-width:min-content}
.tree ul{display:flex;justify-content:center;padding:20px 0 0;margin:0;position:relative}
.tree>ul{padding-top:0}
.tree li{list-style:none;text-align:center;position:relative;padding:20px 4px 0}
.tree>ul>li{padding-top:0}
.tree li::before,.tree li::after{content:"";position:absolute;top:0;right:50%;width:50%;height:20px;border-top:1px solid var(--line)}
.tree li::after{right:auto;left:50%;border-left:1px solid var(--line)}
.tree>ul>li::before,.tree>ul>li::after{display:none}
.tree li:only-child::before,.tree li:only-child::after{display:none}
.tree li:only-child{padding-top:20px}
.tree li:first-child::before,.tree li:last-child::after{border:0 none}
.tree li:last-child::before{border-right:1px solid var(--line);border-radius:0 6px 0 0}
.tree li:first-child::after{border-radius:6px 0 0 0}
.tree ul ul::before{content:"";position:absolute;top:0;left:50%;border-left:1px solid var(--line);height:20px}
.n{display:inline-block;width:104px;background:var(--card);border:1px solid var(--line);border-radius:8px;padding:5px 4px;font-size:.7rem;line-height:1.25}
.n b{display:block;font-size:.78rem}
.n i{display:block;font-style:normal;color:var(--mute);font-size:.64rem}
.n .s{margin-top:3px;padding-top:3px;border-top:1px dashed var(--line)}
.n.top{width:170px;background:var(--warm)}
.n.me{background:var(--me)}
.n.note{background:none;border-style:dashed;color:var(--mute)}
</style>
</head>
<body>
<h1>Mening shajaram</h1>
<p class="hint">Katta bo‘lsa, yon tomonga suring</p>
<h2>Dadam tomoni</h2>
<div class="scroll"><div class="tree" id="dad"></div></div>
<h2>Onam tomoni</h2>
<div class="scroll"><div class="tree" id="mom"></div></div>
<script>
const P=(n,d,s,k,c)=>({n,d,s,k,c});
const dad=P("Mirpolat","07.11.1958",["Dilfuza","19.02.1963"],[
P("Rustam","09.01.1981",["Fotima","28.02.1987"],[
 P("Durdona","04.08.2005",["Xusanboy","08.02.2001"],[P("Muhammadali","16.07.2025")]),
 P("Ruxsora","09.01.2008",["Bahodir",""],[P("Xolid","03.10.2026")]),
 P("Ezoza","16.04.2010"),P("Muhammadamin","14.01.2012"),P("Osiyo","23.11.2016")]),
P("Umida","05.05.1982",["Eri","05.01.1981"],[
 P("Elmurod","20.05.2001",["Iroda","26.03.2006"]),
 P("Aziza","20.12.2005",["Nizomiddin","20.11.1997"],[P("Muhammad","04.06.2023"),P("Soliha","30.07.2025")]),
 P("MuhammadSolih","03.01.2010")]),
P("Jasur (dadam)","31.08.1983",["Dildora (onam)","08.02.1990"],[
 P("Muslima (men)","01.12.2008",0,0,"me"),P("Muhammadyusuf","21.12.2010"),P("Firdavs","24.09.2013"),P("Jasmin","17.07.2018"),P("Oisha","07.03.2025")],"me"),
P("Dilobar","1985",["Bahodir","16.08.1980"],[
 P("Mubina","28.06.2007",["Ahmad","28.06.1999"]),P("Iymona","20.07.2011"),P("Soliha","08.08.2013")]),
P("Dilorom","11.10.1987",["Akmal","12.04.1983"],[
 P("Abdulloh","27.06.2008"),P("Abdurahmon","08.10.2011"),P("Sora","28.08.2016")])
],"top");
const mom=P("Davron","27.04.1965",["Muxtabar","09.07.1968"],[
P("Durdona","20.03.1988",["Rovshan","26.03.1981"],[
 P("Anvarjon","04.11.2006"),P("Abdulloh","28.06.2008"),P("Muhammadbilol","20.08.2013"),P("Xadija","31.12.2020")]),
P("Dildora (onam)","08.02.1990",["Jasur (dadam)","31.08.1983"],[P("Bolalari dadam tomonidagi shajarada",0,0,0,"note")],"me"),
P("Javlon","12.07.1992",["Dilobar","28.09.1997"],[
 P("Umar","16.12.2017"),P("Abdurahmon","20.03.2020"),P("Muhammadamin","29.03.2022"),P("Safiya","31.07.2026")]),
P("Munisa","31.12.1999",["Alisher","29.04.1993"],[
 P("Madina","19.08.2017"),P("Rayyona","19.07.2022"),P("Muhammadali","01.04.2026")])
],"top");
const node=p=>`<li><div class="n ${p.c||""}"><b>${p.n}</b>${p.d?`<i>${p.d}</i>`:""}${p.s?`<div class="s"><b>♥ ${p.s[0]}</b>${p.s[1]?`<i>${p.s[1]}</i>`:""}</div>`:""}</div>${p.k?`<ul>${p.k.map(node).join("")}</ul>`:""}</li>`;
document.getElementById("dad").innerHTML=`<ul>${node(dad)}</ul>`;
document.getElementById("mom").innerHTML=`<ul>${node(mom)}</ul>`;
</script>
</body>
</html>
